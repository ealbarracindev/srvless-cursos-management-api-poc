  /swagger-ui:
    get:
      summary: "Interfaz de Swagger UI"
      description: "Devuelve el HTML de Swagger UI para visualizar la documentación"
      responses:
        "200":
          description: "Página de Swagger UI"
      x-amazon-apigateway-integration:
        uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SwaggerUIFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
  /docs:
    get:
      summary: "Obtener la documentación Swagger de la API"
      description: "Devuelve el archivo Swagger en formato JSON"
      responses:
        "200":
          description: "Swagger obtenido correctamente"
      x-amazon-apigateway-integration:
        uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SwaggerFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
