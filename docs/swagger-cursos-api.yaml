---
swagger: "2.0"
info:
  version: "1.0"
  title: "apps-dev-cursos-api-gateway"
host: "cdjl5u7ah8.execute-api.us-east-1.amazonaws.com"
basePath: "/dev"
schemes:
- "https"
paths:
  /cursos:
    post:
      summary: "Crear un curso"
      x-amazon-apigateway-integration:
        uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateCursoFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy      
    get:
      summary: "Listar cursos"
      x-amazon-apigateway-integration:
        uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions:${ListCursosFunction.Arn}/invocations
        httpMethod: POST
        type: aws_proxy
      responses: {}
